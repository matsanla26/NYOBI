        }

            margin-top:25px;
            background:#f8f9fa;
            padding:20px;
            border-radius:15px;
            display:none;
        }

            margin-top:20px;

            padding:12px;
            border-radius:10px;
            font-size:22px;

    // Fitur tambahan: Tekan Enter untuk cek kelulusan
    document.getElementById("nisn").addEventListener("keyup", function(event) {
        if (event.key === "Enter") {
            cekKelulusan();
        }
    });

    // ================= CEK KELULUSAN =================
    function cekKelulusan(){
        const nisnInput = document.getElementById("nisn").value.trim();
        const hasilBox = document.getElementById("hasil");

        if(nisnInput === "") {
            alert("Silakan masukkan NISN terlebih dahulu!");
            return;
        }

        const data = siswa.find(s => s.nisn === nisnInput);

        // Jika ditemukan
        if(data){
            hasilBox.style.display = "block";
            hasilBox.innerHTML = `
                <h2 style="text-align:center; color:#0f5132; margin-bottom: 15px;">
                    HASIL KELULUSAN
                </h2>
                <p><b>Nama :</b> ${data.nama}</p>
                <p style="margin-top: 5px;"><b>NISN :</b> ${data.nisn}</p>
                <div class="status">${data.status ? data.status.toUpperCase() : 'LULUS'}</div>
            `;
        } 
        // Jika tidak ditemukan
        else {
            hasilBox.style.display = "block";
            hasilBox.innerHTML = `
                <div class="status" style="background:#dc3545;">
                    Data Tidak Ditemukan. Hubungi Admin!
                </div>
            `;
        }
    }
</script>
